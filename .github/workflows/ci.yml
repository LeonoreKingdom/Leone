name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leone_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate migrations on an empty database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202608030001_initial_leone.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202608030002_import_tracking_and_cron.sql
      - name: Scan committed files for common secret assignments
        run: git grep -nE '(DISCORD_TOKEN|DATABASE_URL|CLIENT_SECRET|SCHEDULER_SECRET)=[^<[:space:]]{8,}' -- ':!package-lock.json' && exit 1 || exit 0
