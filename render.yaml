services:
  - type: web
    name: leone-chat-worker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/chat-worker.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SERVER_STATS_GATEWAY_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "600"
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "12000"
      - key: CHATBOT_DAILY_REQUEST_LIMIT
        value: "100"
      - key: CHATBOT_PER_USER_COOLDOWN_SECONDS
        value: "15"
      - key: CHATBOT_TOPIC_MATCH_MIN_RANK
        value: "0.02"
      - key: CHATBOT_TOPIC_COOLDOWN_SECONDS
        value: "45"
